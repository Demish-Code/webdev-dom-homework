<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
      "use strict";

  const comments = [
    {
      name: "Глеб Фокин",
      date: "12.02.22 12:18",
      text: "Это будет первый комментарий на этой странице",
      likes: 3,
      isLiked: false,
    },
    {
      name: "Варвара Н.",
      date: "13.02.22 19:22",
      text: "Мне нравится как оформлены комментарии!",
      likes: 75,
      isLiked: true,
    },
  ];

  const commentsListElement = document.querySelector(".comments");
  const nameInputElement = document.querySelector(".add-form-name");
  const commentInputElement = document.querySelector(".add-form-text");
  const addButtonElement = document.querySelector(".add-form-button");

  function formatDate(date) {
    const day = String(date.getDate()).padStart(2, "0");
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const year = String(date.getFullYear() % 100).padStart(2, "0");
    const hours = String(date.getHours()).padStart(2, "0");
    const minutes = String(date.getMinutes()).padStart(2, "0");
    return `${day}.${month}.${year} ${hours}:${minutes}`;
  }

  function initLikeListeners() {
    const likeButtonElements = document.querySelectorAll(".like-button");
    for (const likeButtonElement of likeButtonElements) {
      likeButtonElement.addEventListener("click", function (event) {
        event.stopPropagation();
        const index = likeButtonElement.dataset.index;
        if (comments[index].isLiked) {
          comments[index].likes -= 1;
          comments[index].isLiked = false;
        } else {
          comments[index].likes += 1;
          comments[index].isLiked = true;
        }
        renderComments();
      });
    }
  }

  function renderComments() {
    const commentsHtml = comments
      .map(function (comment, index) {
        return `
          <li class="comment">
            <div class="comment-header">
              <div>${comment.name}</div>
              <div>${comment.date}</div>
            </div>
            <div class="comment-body">
              <div class="comment-text">${comment.text}</div>
            </div>
            <div class="comment-footer">
              <div class="likes">
                <span class="likes-counter">${comment.likes}</span>
                <button data-index="${index}" class="like-button ${
                  comment.isLiked ? "-active-like" : ""
                }"></button>
              </div>
            </div>
          </li>
        `;
      })
      .join("");

    commentsListElement.innerHTML = commentsHtml;
    initLikeListeners();
  }

  function addComment() {
    const trimmedName = nameInputElement.value.trim();
    const trimmedComment = commentInputElement.value.trim();

    if (trimmedName === "" || trimmedComment === "") {
      if (trimmedName === "") {
        nameInputElement.classList.add("-error");
        nameInputElement.style.backgroundColor = "#ffb8b8";
      }
      if (trimmedComment === "") {
        commentInputElement.classList.add("-error");
        commentInputElement.style.backgroundColor = "#ffb8b8";
      }
      return;
    }

    const currentDate = formatDate(new Date());

    comments.push({
      name: trimmedName,
      date: currentDate,
      text: trimmedComment,
      likes: 0,
      isLiked: false,
    });

    renderComments();
    nameInputElement.value = "";
    commentInputElement.value = "";
  }

  function handleNameInput() {
    nameInputElement.classList.remove("-error");
    nameInputElement.style.backgroundColor = "";
  }

  function handleCommentInput() {
    commentInputElement.classList.remove("-error");
    commentInputElement.style.backgroundColor = "";
  }

  addButtonElement.addEventListener("click", addComment);
  nameInputElement.addEventListener("input", handleNameInput);
  commentInputElement.addEventListener("input", handleCommentInput);

  renderComments();
    console.log("It works!");
  </script>
</html>

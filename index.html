<!doctype html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">Это будет первый комментарий на этой странице</div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">Мне нравится как оформлена эта страница! ❤</div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input type="text" class="add-form-name" placeholder="Введите ваше имя" />
        <textarea type="textarea" class="add-form-text" placeholder="Введите ваш коментарий" rows="4"></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";

    // Находим элементы
    const commentsListElement = document.querySelector(".comments");
    const nameInputElement = document.querySelector(".add-form-name");
    const commentInputElement = document.querySelector(".add-form-text");
    const addButtonElement = document.querySelector(".add-form-button");

    // Форматирование даты
    function formatDate(date) {
      let day = date.getDate();
      let month = date.getMonth() + 1;
      let year = date.getFullYear() % 100;
      let hours = date.getHours();
      let minutes = date.getMinutes();

      if (day < 10) day = "0" + day;
      if (month < 10) month = "0" + month;
      if (year < 10) year = "0" + year;
      if (hours < 10) hours = "0" + hours;
      if (minutes < 10) minutes = "0" + minutes;

      return `${day}.${month}.${year} ${hours}:${minutes}`;
    }

    // Функция добавления комментария
    function addComment() {
      const trimmedName = nameInputElement.value.trim();
      const trimmedComment = commentInputElement.value.trim();

      // Валидация
      if (trimmedName === "" || trimmedComment === "") {
        if (trimmedName === "") {
          nameInputElement.classList.add("-error");
          nameInputElement.style.backgroundColor = "#ffb8b8"; 
        }
        if (trimmedComment === "") {
          commentInputElement.classList.add("-error");
          commentInputElement.style.backgroundColor = "#ffb8b8"; 
        }
        return;
      }

      const currentDate = formatDate(new Date());

      const newCommentHtml = `
      <li class="comment">
        <div class="comment-header">
          <div>${trimmedName}</div>
          <div>${currentDate}</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            ${trimmedComment}
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">0</span>
            <button class="like-button"></button>
          </div>
        </div>
      </li>
    `;

      commentsListElement.innerHTML += newCommentHtml;

      // Очистка полей
      nameInputElement.value = "";
      commentInputElement.value = "";
    }

    // Сброс ошибок при вводе
    function handleNameInput() {
      nameInputElement.classList.remove("-error");
      nameInputElement.style.backgroundColor = "";
    }

    function handleCommentInput() {
      commentInputElement.classList.remove("-error");
      commentInputElement.style.backgroundColor = "";
    }

    // Слушатели событий
    addButtonElement.addEventListener("click", addComment);
    nameInputElement.addEventListener("input", handleNameInput);
    commentInputElement.addEventListener("input", handleCommentInput);
    console.log("It works!");
  </script>
</html>
